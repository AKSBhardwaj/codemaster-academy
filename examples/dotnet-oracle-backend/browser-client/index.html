<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Reading List — local API practice</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main>
      <h1>My reading list</h1>
      <p>Add a book you want to read. This page talks to your local practice API.</p>
      <form id="book-form">
        <label for="title">Book title</label>
        <input id="title" name="title" required maxlength="120" autocomplete="off" />
        <label class="check"><input id="is-read" type="checkbox" /> I have read this book</label>
        <button id="add" type="submit">Add book</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <section aria-labelledby="books-heading">
        <h2 id="books-heading">Books</h2>
        <button id="refresh" type="button">Refresh list</button>
        <ul id="books"></ul>
      </section>
    </main>
  </body>
</html>
