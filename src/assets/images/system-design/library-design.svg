<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 544" width="400" height="544" role="img" aria-labelledby="title desc">
<title id="title">Borrow one physical copy</title><desc id="desc">Browser: Ask to borrow copy C7. Library service: Check who may borrow it. One transaction: Check and save the loan together. Reply: Confirm the saved result</desc>
