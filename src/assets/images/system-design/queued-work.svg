<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 544" width="400" height="544" role="img" aria-labelledby="title desc">
<title id="title">Save now, do work later</title><desc id="desc">Book service: Save a reminder job. Durable queue: Keep the job until it is handled. Worker: Read and process the job. Completion: Acknowledge successful work</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#69529b" stroke-width="1.5"/></marker></defs>
<rect width="400" height="544" rx="18" fill="#f8f7ff"/>
<text x="200" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#26213e">Save now, do work later</text><rect x="30" y="62" width="340" height="74" rx="14" fill="#ede9fe" stroke="#8068ca" stroke-width="2"/><text x="200" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#26213e">Book service</text><text x="200" y="117" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#55506b">Save a reminder job</text><path d="M200 138 L200 180" fill="none" stroke="#69529b" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="30" y="192" width="340" height="74" rx="14" fill="#ffffff" stroke="#c5c0d6" stroke-width="2"/><text x="200" y="222" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#26213e">Durable queue</text><text x="200" y="247" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#55506b">Keep the job until it is handled</text><path d="M200 268 L200 310" fill="none" stroke="#69529b" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="30" y="322" width="340" height="74" rx="14" fill="#ede9fe" stroke="#8068ca" stroke-width="2"/><text x="200" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#26213e">Worker</text><text x="200" y="377" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#55506b">Read and process the job</text><path d="M200 398 L200 440" fill="none" stroke="#69529b" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="30" y="452" width="340" height="74" rx="14" fill="#ffffff" stroke="#c5c0d6" stroke-width="2"/><text x="200" y="482" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#26213e">Completion</text><text x="200" y="507" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#55506b">Acknowledge successful work</text>
</svg>
