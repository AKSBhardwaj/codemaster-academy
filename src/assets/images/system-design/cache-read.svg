<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 596" width="400" height="596" role="img" aria-labelledby="title desc">
<title id="title">Cache hit and cache miss</title><desc id="desc">A fresh cached copy can go straight to the reply. If no fresh copy exists, the service reads the database, refreshes the cache, and replies.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#69529b" stroke-width="1.5"/></marker></defs>
<rect width="400" height="596" rx="18" fill="#f8f7ff"/>
<text x="200" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#26213e">Read through a cache</text><rect x="24" y="62" width="266" height="74" rx="14" fill="#ede9fe" stroke="#8068ca" stroke-width="2"/><text x="157" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#26213e">Book service</text><text x="157" y="117" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#55506b">Ask for a title</text><path d="M157 138 L157 180" fill="none" stroke="#69529b" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="24" y="190" width="266" height="74" rx="14" fill="#ffffff" stroke="#c5c0d6" stroke-width="2"/><text x="157" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#26213e">Cache</text><text x="157" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#55506b">Check the saved copy</text><path d="M157 266 L157 330" fill="none" stroke="#69529b" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="92" y="307" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#26213e">No fresh copy</text><rect x="24" y="340" width="266" height="74" rx="14" fill="#ede9fe" stroke="#8068ca" stroke-width="2"/><text x="157" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#26213e">Database</text><text x="157" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#55506b">Read the current record</text><path d="M157 416 L157 484" fill="none" stroke="#69529b" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="102" y="457" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#26213e">Refresh cache</text><rect x="24" y="494" width="266" height="74" rx="14" fill="#ffffff" stroke="#c5c0d6" stroke-width="2"/><text x="157" y="524" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#26213e">Reply</text><text x="157" y="549" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#55506b">Return the book title</text><path d="M292 226 L346 226 L346 530 L294 530" fill="none" stroke="#69529b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="345" y="298" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#26213e">Fresh</text><text x="345" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#26213e">copy</text>
</svg>
