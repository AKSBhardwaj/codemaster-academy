<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 526" width="400" height="526" role="img" aria-labelledby="title desc">
<title id="title">A load balancer shares requests</title><desc id="desc">Server B is offline. The load balancer sends requests to healthy servers A and C. They share one database, which can still be a bottleneck.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#69529b" stroke-width="1.5"/></marker></defs>
<rect width="400" height="526" rx="18" fill="#f8f7ff"/>
<text x="200" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#26213e">Share incoming requests</text><rect x="72" y="62" width="256" height="74" rx="14" fill="#ede9fe" stroke="#8068ca" stroke-width="2"/><text x="200" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#26213e">Load balancer</text><text x="200" y="117" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#55506b">Choose a healthy server</text><path d="M155 138 L72 208" fill="none" stroke="#69529b" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M245 138 L328 208" fill="none" stroke="#69529b" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="16" y="216" width="112" height="74" rx="14" fill="#ffffff" stroke="#c5c0d6" stroke-width="2"/><text x="72" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#26213e">Server A</text><text x="72" y="271" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#55506b">Ready</text><rect x="144" y="216" width="112" height="74" rx="14" fill="#ffffff" stroke="#c5c0d6" stroke-width="2"/><text x="200" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#26213e">Server B</text><text x="200" y="271" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#55506b">Offline</text><rect x="272" y="216" width="112" height="74" rx="14" fill="#ffffff" stroke="#c5c0d6" stroke-width="2"/><text x="328" y="246" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#26213e">Server C</text><text x="328" y="271" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#55506b">Ready</text><path d="M72 292 L155 378" fill="none" stroke="#69529b" stroke-width="2.5"  marker-end="url(#arrow)"/><path d="M328 292 L245 378" fill="none" stroke="#69529b" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="62" y="388" width="276" height="74" rx="14" fill="#ede9fe" stroke="#8068ca" stroke-width="2"/><text x="200" y="418" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#26213e">One database</text><text x="200" y="443" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#55506b">Shared book records</text><text x="200" y="498" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#26213e">A shared part can still get busy.</text>
</svg>
