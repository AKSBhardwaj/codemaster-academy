<fieldset
  class="cma-question"
  [disabled]="disabled() || !interactive()"
  [attr.aria-busy]="!interactive()"
>
  <legend class="cma-question__text"><cma-inline [text]="displayQuestion()" /></legend>

  @if (code(); as code) {
    <cma-code-block
      [code]="code.code"
      [language]="code.language"
      [showLineNumbers]="question().type === 'find-error'"
    />
  }

  @switch (question().type) {
    @case ('true-false') {
      <div class="cma-question__options cma-question__options--row">
        @for (value of [true, false]; track value) {
          <label
            class="cma-question__option"
            [class.cma-question__option--selected]="selectedBoolean() === value"
            [class.cma-question__option--correct]="reveal() && correctBoolean() === value"
            [class.cma-question__option--wrong]="
              reveal() && selectedBoolean() === value && correctBoolean() !== value
            "
          >
            <input
              type="radio"
              [name]="name"
              [checked]="selectedBoolean() === value"
              (change)="chooseBoolean(value)"
              [disabled]="disabled()"
            />
            <span>{{ value ? 'True' : 'False' }}</span>
          </label>
        }
      </div>
    }
    @case ('fill-blank') {
      <div class="cma-question__blank">
        <label class="form-label small fw-semibold" [for]="name + '-text'">Your answer</label>
        <input
          [id]="name + '-text'"
          type="text"
          class="form-control"
          autocomplete="off"
          spellcheck="false"
          [value]="textValue()"
          (input)="onText($event)"
          [disabled]="disabled()"
        />
      </div>
    }
    @default {
      <div class="cma-question__options">
        @for (option of options(); track $index; let i = $index) {
          <label
            class="cma-question__option"
            [class.cma-question__option--selected]="selectedIndex() === i"
            [class.cma-question__option--correct]="reveal() && correctIndex() === i"
            [class.cma-question__option--wrong]="
              reveal() && selectedIndex() === i && correctIndex() !== i
            "
          >
            <input
              type="radio"
              [name]="name"
              [checked]="selectedIndex() === i"
              (change)="choose(i)"
              [disabled]="disabled()"
            />
            <span><cma-inline [text]="option" /></span>
          </label>
        }
      </div>
    }
  }
</fieldset>
