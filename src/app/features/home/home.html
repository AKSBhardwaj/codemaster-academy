<section class="cma-hero">
  <div class="container-xxl">
    <div class="cma-hero__inner">
      <p class="cma-eyebrow mb-3">Free, structured developer education</p>
      <h1 class="cma-hero__title">Learn to code with clear, practical tutorials</h1>
      <p class="lead cma-text-secondary cma-hero__lead">
        Step-by-step lessons, runnable examples, exercises and quizzes for 100+ languages, frameworks, databases and
        developer tools. Built for beginners, useful for professionals.
      </p>
      <form class="cma-hero__search" role="search" (ngSubmit)="submitSearch()">
        <label class="visually-hidden" for="home-search">Search tutorials</label>
        <div class="input-group input-group-lg">
          <span class="input-group-text" aria-hidden="true"><cma-icon name="search" [size]="18" /></span>
          <input
            id="home-search"
            type="search"
            class="form-control"
            placeholder="Search tutorials, e.g. Angular, SQL joins, Python lists"
            autocomplete="off"
            [formControl]="query"
          />
          <button class="btn btn-primary px-4" type="submit">Search</button>
        </div>
      </form>
      <div class="d-flex flex-wrap gap-2 mt-4">
        <a class="btn btn-primary btn-lg d-inline-flex align-items-center gap-2" routerLink="/tutorials">
          Explore tutorials <cma-icon name="arrow-right" />
        </a>
        <a class="btn btn-outline-secondary btn-lg" routerLink="/learning-paths">Browse learning paths</a>
      </div>
    </div>
  </div>
</section>

<section class="cma-section">
  <div class="container-xxl">
    <cma-work-in-progress feature="The home page discovery sections (learning paths, popular tutorials, categories, FAQ)" [phase]="3" />
  </div>
</section>
