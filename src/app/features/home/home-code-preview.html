<div class="hero-lab" aria-label="An example of a first web page">
  <div class="hero-lab__top">
    <div class="window-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <span>your-first-idea.html</span><cma-icon name="code-slash" [size]="16" />
  </div>
  <h2 class="visually-hidden">A tiny piece of code. A real beginning.</h2>
  <div class="hero-lab__code">
    <div>
      <span class="line-no">1</span><span class="code-purple">&lt;h1&gt;</span>Hello, world!<span
        class="code-purple"
        >&lt;/h1&gt;</span
      >
    </div>
    <div>
      <span class="line-no">2</span><span class="code-purple">&lt;p&gt;</span>I made this.<span
        class="code-purple"
        >&lt;/p&gt;</span
      >
    </div>
    <div>
      <span class="line-no">3</span
      ><span class="code-comment">&lt;!-- Your story starts here. --&gt;</span>
    </div>
  </div>
  <div class="hero-lab__result">
    <span class="preview-label"><span></span> WHAT YOUR PAGE SHOWS</span>
    <h3>Hello, world! <span aria-hidden="true">&#10022;</span></h3>
    <p>I made this.</p>
  </div>
  <a
    class="hero-lab__try"
    routerLink="/playground"
    [queryParams]="{ lang: 'html', template: 'hello-page' }"
    ><cma-icon name="play-fill" [size]="17" /> Try your own page
    <cma-icon name="arrow-up-right" [size]="15"
  /></a>
  <div class="hero-lab__note">
    <cma-icon name="lightbulb" [size]="18" /><span
      >Small steps.<br /><strong>Real skills.</strong></span
    >
  </div>
</div>
