<cma-page-header
  eyebrow="Account"
  title="Log in"
  lead="Access your dashboard, profile and progress overview."
/>
<div class="container-xxl py-4 py-lg-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
      <cma-demo-notice />
      <form class="cma-card p-4" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        @if (error()) {
          <div class="alert alert-danger" role="alert">{{ error() }}</div>
        }
        <div class="mb-3">
          <label class="form-label" for="login-email">Email</label>
          <input
            id="login-email"
            type="email"
            class="form-control"
            formControlName="email"
            autocomplete="email"
            [class.is-invalid]="submitted() && form.controls.email.invalid"
          />
          @if (submitted() && form.controls.email.invalid) {
            <div class="invalid-feedback">Enter a valid email address.</div>
          }
        </div>
        <div class="mb-4">
          <label class="form-label" for="login-password">Password</label>
          <input
            id="login-password"
            type="password"
            class="form-control"
            formControlName="password"
            autocomplete="current-password"
            [class.is-invalid]="submitted() && form.controls.password.invalid"
          />
          @if (submitted() && form.controls.password.invalid) {
            <div class="invalid-feedback">Enter your password.</div>
          }
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="busy()">
          {{ busy() ? 'Logging in…' : 'Log in' }}
        </button>
        <p class="small cma-text-secondary mt-3 mb-0 text-center">
          No account yet? <a routerLink="/register">Create a demo account</a>.
        </p>
      </form>
    </div>
  </div>
</div>
