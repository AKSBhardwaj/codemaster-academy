<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CodeMaster Academy</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1120" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="brand/favicon.svg" />
    <script>
      // Applies the saved colour theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var raw = localStorage.getItem('cma:v1:theme');
          var pref = raw ? JSON.parse(raw) : 'system';
          var theme =
            pref === 'light' || pref === 'dark'
              ? pref
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-bs-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-bs-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <cma-root></cma-root>
  </body>
</html>
