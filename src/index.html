<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CodeMaster Academy</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fd" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#11121b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CodeMaster" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="ard" href=".well-known/ard.json" type="application/json" />
    <link rel="alternate" href="llms.txt" type="text/plain" title="Guide to the tutorials" />
    <link rel="apple-touch-icon" href="brand/app-192.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="brand/favicon.svg" />
    <script>
      // Applies the saved colour theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var raw = localStorage.getItem('cma:v1:theme');
          var pref = raw ? JSON.parse(raw) : 'system';
          var theme =
            pref === 'light' || pref === 'dark'
              ? pref
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-bs-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-bs-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <cma-root></cma-root>
  </body>
</html>
